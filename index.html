<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños ❤️</title>
<style>
*{box-sizing:border-box;font-family:"Georgia","Segoe UI",serif}
body{
margin:0;color:white;overflow:hidden;
background:linear-gradient(135deg,#07152f,#1d4f91,#020617);
}
section{
height:100vh;display:flex;align-items:center;justify-content:center;
flex-direction:column;text-align:center;padding:25px
}
.hidden{display:none}
h1{
font-size:42px;color:#ffd76a;
text-shadow:0 0 18px #ffd76a
}
p{
font-size:21px;line-height:1.8;max-width:700px
}
button{
padding:14px 35px;border:0;border-radius:30px;
background:linear-gradient(45deg,#ffd700,#ff9d00);
font-size:17px;font-weight:bold;cursor:pointer;margin:8px
}
.card{
background:rgba(255,255,255,.96);
color:#222;padding:40px;border-radius:25px;
max-width:800px;width:90%;
box-shadow:0 20px 70px #000;
animation:entrada 1s;
}
.card h1{color:#163b70;text-shadow:none}
@keyframes entrada{
from{opacity:0;transform:translateY(40px)}
to{opacity:1}
}

.barra{
width:330px;height:22px;background:#222;
border-radius:20px;overflow:hidden
}
.progreso{
height:100%;width:0;background:#ffd700
}

.foto-portada{
width:320px;height:320px;border-radius:50%;
overflow:hidden;border:8px solid #ffd700;
box-shadow:0 0 40px #ffd700;
margin:0 auto 25px
}

.foto-portada img,.foto img{
width:100%;height:100%;object-fit:cover
}

.foto{
width:190px;height:190px;border-radius:50%;
overflow:hidden;border:5px solid #ffd700;
margin:20px auto
}

.galeria{
display:flex;gap:15px;justify-content:center;
flex-wrap:wrap;margin:20px
}

.galeria img{
width:140px;height:140px;
border-radius:20px;border:5px solid #ffd700;
object-fit:cover
}

.confeti{
position:absolute;width:10px;height:18px;top:-20px;
animation:caer 6s linear infinite
}
@keyframes caer{
0%{transform:translateY(-10vh) rotate(0)}
100%{transform:translateY(110vh) rotate(720deg)}
}
</style>
</head>

<body>


<audio id="musica" loop >

<source src="flaca.mp3" type="audio/mp3">
</audio>

<audio id="sonidoRegalo">
<source src="sonido_regalo.mp3" type="audio/mp3">
</audio>

<audio id="sonidoPagina">
<source src="sonido_pagina.mp3" type="audio/mp3">
</audio>

<audio id="sonidoFinal">
<source src="sonido_final.mp3" type="audio/mp3">
</audio>

<button id="audioBtn" onclick="controlMusica()" style="
position:fixed;right:20px;bottom:20px;border-radius:50%;
width:55px;height:55px;padding:0;z-index:10;">🎵</button>

<script>
let colores=["#ffd700","#ff7b00","#2ec4ff","#ffffff","#ff4d6d"];
for(let i=0;i<90;i++){
let c=document.createElement("div");
c.className="confeti";
c.style.left=Math.random()*100+"%";
c.style.background=colores[Math.floor(Math.random()*colores.length)];
c.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(c);
}
</script>

<section id="inicio">
<h1>🎂 Feliz Cumpleaños ❤️</h1>
<p>Preparando una sorpresa especial para ti...</p>
<div class="barra"><div id="bar" class="progreso"></div></div>
<h2 id="porcentaje">0%</h2>
<button id="continuar" style="display:none" onclick="mostrarRegalo()">Continuar 🎁</button>
</section>

<section id="regalo" class="hidden">
<h1>Tengo algo especial para ti ✨</h1>
<p>Una pequeña carta hecha con mucho amor.</p>
<button onclick="abrirCarta()">Abrir carta ❤️</button>
</section>

<section id="carta" class="hidden">
<div class="card">

<div id="contenidoFoto"></div>

<h1 id="titulo"></h1>
<p id="texto"></p>

<button onclick="anterior()">←</button>
<button onclick="siguiente()">→</button>
<button onclick="cerrar()">Cerrar ✕</button>

</div>
</section>

<script>

let c=0;
let carga=setInterval(()=>{
c++;
bar.style.width=c+"%";
porcentaje.innerHTML=c+"%";
if(c>=100){
clearInterval(carga);
continuar.style.display="block";
}
},45);


let paginas=[

["Feliz cumpleaños mi amor ❤️",
"Hoy quiero celebrar tu vida y recordarte lo importante que eres para mí. Deseo que este día esté lleno de alegría, sonrisas y momentos inolvidables.",
"portada"],

["Nuestros recuerdos 📸",
"Quise guardar un pequeño espacio para recordar algunos momentos especiales.",
"galeria"],

["Quiero decirte algo especial ✨",
"Quiero que sepas que te amo mucho. Gracias por cada sonrisa, cada conversación y todos los momentos bonitos a tu lado.",
"mensaje"],

["Gracias por los buenos momentos 💙",
"Gracias por formar parte de mi vida y por esas pequeñas cosas que hacen especial cada recuerdo.",
"recuerdo"],

["Siempre recuerda 🌟",
"Eres una persona maravillosa. Nunca dudes de tu valor y sigue luchando por tus sueños.",
"nada"],

["Con todo mi amor ❤️",
"Espero que este nuevo año de vida te traiga mucha felicidad, salud y éxitos. Por muchos cumpleaños más juntos \n\n25/09",
"final"]

];

let pagina=0;

function mostrarRegalo(){
inicio.classList.add("hidden");
regalo.classList.remove("hidden");
}

function abrirCarta(){
regalo.classList.add("hidden");
carta.classList.remove("hidden");

document.getElementById("musica").play();
document.getElementById("sonidoRegalo").play();

mostrar();
}

function mostrar(){

document.getElementById("sonidoPagina").play();

let html="";

if(paginas[pagina][2]=="portada"){
html=`<div class="foto-portada">
<img src="imagen 01.jpeg">
</div>`;
}

if(paginas[pagina][2]=="galeria"){
html=`<div class="galeria">
<img src="imagen 02.jpeg">
<img src="imagen 03.jpeg">
<img src="imagen 04.jpeg">
<img src="imagen 05.jpeg">
</div>`;
}

if(paginas[pagina][2]=="mensaje"){
html=`<div class="foto">
<img src="imagen 07.jpeg">
</div>`;
}

if(paginas[pagina][2]=="recuerdo"){
html=`<div class="foto">
<img src="imagen 06.jpeg">
</div>`;
}

if(paginas[pagina][2]=="final"){
html=`<div class="foto-portada">
<img src="imagen 08.jpeg">
</div>`;
}

contenidoFoto.innerHTML=html;
titulo.innerHTML=paginas[pagina][0];
texto.innerHTML=paginas[pagina][1];

}

function siguiente(){
if(pagina<paginas.length-1){
pagina++;
mostrar();

if(pagina==paginas.length-1){
document.getElementById("sonidoFinal").play();
}
}
}

function anterior(){
if(pagina>0){
pagina--;
mostrar();
}
}

function cerrar(){
location.reload();
}


function controlMusica(){
let m=document.getElementById("musica");
let b=document.getElementById("audioBtn");

if(m.paused){
m.play();
b.innerHTML="🔊";
}else{
m.pause();
b.innerHTML="🎵";
}
}


</script>

</body>
</html>
